# Curated model catalog — canonical ids, aliases, and pinned GGUF artifacts.
# A provisional seed list; the final list is still being chosen.
# Canonical id convention: org/model-name.
#
# This file is not a serve gate. What survives here is
# (a) the network-standard model entries below (canonical ids, aliases,
# managed-GGUF pins — a sha256 nobody verified is not a pin) and (b) the
# default pricing curve. Everything else a node serves is auto-collected
# into a service card and published under "<node_id>/<raw_tag>".
