# Default pricing curve: micro-USD per 1M tokens for publisher
# cards whose operator did not set a price. First row with max_params_b >=
# the card's params_b wins; params 0 → cheapest row. These are real
# prices: they figure in every /v1/models entry and every usage.cost, and
# consumers are billed exactly this. Policy (2026-11-17): network default
# price = 50% of market; these bands are the median of the halved
# network_prices list per size class. The pre-halving rows are kept in
# code (catalog.LegacyCurvePrice) so the router can still recognize an
# old node's curve price as "not operator-set". An operator's
# --price-in/--price-out always wins.
pricing:
  curve:
    - {max_params_b: 4, price_in_per_1m: 10000, price_out_per_1m: 20000}
    - {max_params_b: 16, price_in_per_1m: 50000, price_out_per_1m: 100000}
    - {max_params_b: 1000, price_in_per_1m: 60000, price_out_per_1m: 200000}

# Network price list (2026-11-17): per-model overrides for cards the
# catalog does not map — match strings are raw backend tags (lower-cased,
# a trailing :latest is normalized both ways), in/out are micro-USD per
# 1M, each 50% of the model's market price (source rule in the plan:
# OpenRouter → provider live API → author API → median → band, then a
# sibling cap). Applied by the router at card intake to every card whose
# price is a node default; a card the catalog maps gets its suggested
# price instead; operator-set prices are never touched. Embedding models
# are input-only (out 0). source/as_of are documentation.
network_prices:
