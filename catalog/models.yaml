# Default pricing curve: micro-USD per 1M tokens for publisher
# cards whose operator did not set a price. First row with max_params_b >=
# the card's params_b wins; params 0 → cheapest row. These are real
# prices: they figure in every /v1/models entry and every usage.cost, and
# consumers are billed exactly this. Bands track the market
# rates of comparable open-weight models on commercial routers; tune here
# (or per node via --price-in/--price-out) as the operator's price list
# evolves.
pricing:
  curve:
    - {max_params_b: 4, price_in_per_1m: 100000, price_out_per_1m: 300000}
    - {max_params_b: 8, price_in_per_1m: 120000, price_out_per_1m: 400000}
    - {max_params_b: 16, price_in_per_1m: 200000, price_out_per_1m: 700000}
    - {max_params_b: 1000, price_in_per_1m: 300000, price_out_per_1m: 900000}
